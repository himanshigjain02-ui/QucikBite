.lgo svg{height:26px;width:auto;stroke:none}.upi button{justify-content:center;height:58px}.qr{width:170px;height:170px}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}img.qr{object-fit:contain}
/* splash */
#splash{position:absolute;inset:0;background:var(--red);z-index:100;transition:opacity .5s,transform .5s;overflow:hidden}

.stage{position:absolute;top:44%;left:0;right:0;height:0}
.lg{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;font-size:44px;font-weight:500;color:var(--cream);white-space:nowrap;clip-path:inset(0 100% 0 0)}
.pac{--s:56px;width:var(--s);height:var(--s);position:relative;display:inline-block;flex:none}

</style></head><body>

function qr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0,o='';var o='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;const q=x<8&&y<8?[0,0]:x>13&&y<8?[14,0]:x<8&&y>13?[0,14]:null;if(q){const a=x-q[0],b=y-q[1];on=a>=0&&b>=0&&a<7&&b<7&&(a%6==0||b%6==0||(a>1&&a<5&&b>1&&b<5))}else{h=(h*1103515245+12345)>>>0;on=(h>>>16)&1}if(on)o+=`<rect x="${x}" y="${y}" width="1.05" height="1.05"/>`}return `<svg viewBox="0 0 21 21" class=qr fill="currentColor" stroke="none">${o}</svg>`}
